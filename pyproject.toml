[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirpv_ng"
version = "1.0.0"
description = "Next-generation pre-miRNA prediction pipeline (sRNA-seq & sequence-only)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Pradyumna R", email = "pradyumna.r@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "biopython>=1.79",
    "xgboost>=1.5",
    "scipy>=1.7",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.scripts]
mirpv-ng = "mirpv_ng.cli:main"

[tool.setuptools]
packages = ["mirpv_ng"]
